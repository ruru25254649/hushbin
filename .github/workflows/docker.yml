name: Docker image

# x64 (linux/amd64) images on GitHub Container Registry:
#   push to main  → ghcr.io/<owner>/hushbin:latest and :sha-<commit>
#   tag vX.Y.Z    → :X.Y.Z, :X.Y, :X
#   pull request  → build + smoke test only, nothing is pushed

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Hushbin
            org.opencontainers.image.description=Self-hosted end-to-end encrypted clipboard

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hushbin:ci
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run -d --name hb -p 127.0.0.1:8080:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true hushbin:ci
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8080/api/config | grep -q "\"version\":\"$VERSION\""
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="app">'
          docker exec hb /hushbin healthcheck
          [ "$(docker inspect -f '{{.Config.User}}' hb)" = "65532:65532" ]
          docker logs hb
          docker rm -f hb

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
